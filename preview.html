
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101b2d">

  <title>مكتبة مواد الصف الثاني عشر</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #101b2d;
      --text: #ffffff;
      --muted: #b8c7d9;
      --accent: #4c83b8;
    }

    body {
      min-height: 100vh;
      padding: 30px 18px;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--text);

      background:
        radial-gradient(circle at 15% 15%, #29486b 0, transparent 35%),
        radial-gradient(circle at 85% 85%, #253c55 0, transparent 35%),
        var(--bg);
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    /* Header */

    .header {
      text-align: center;
      padding: 35px 15px;
      animation: fadeIn 0.8s ease;
    }

    .icon {
      width: 78px;
      height: 78px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      font-size: 38px;
      border-radius: 23px;

      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);

      box-shadow: 0 10px 35px rgba(0,0,0,0.2);
    }

    h1 {
      font-size: clamp(25px, 5vw, 40px);
      margin-bottom: 12px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 15px;
      line-height: 2;
    }

    /* Library */

    .library {
      background: rgba(255,255,255,0.97);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 22px;
      padding: 20px;

      box-shadow: 0 25px 70px rgba(0,0,0,0.25);

      animation: slideUp 0.8s ease;
    }

    .library-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;

      padding: 5px 5px 18px;
    }

    .library-title {
      color: #172b45;
      font-size: 19px;
      font-weight: 800;
    }

    .status {
      color: #16845c;
      background: #e8f8f0;
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 700;
    }

    /* Google Drive */

    .iframe-container {
      position: relative;
      width: 100%;
      height: 700px;
      overflow: hidden;

      border: 1px solid #e3e8ef;
      border-radius: 14px;
      background: #f7f9fc;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Open Drive Button */

    .open-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      padding: 13px 23px;
      margin-top: 18px;

      color: white;
      background: #1e4269;

      text-decoration: none;
      border-radius: 11px;

      font-size: 14px;
      font-weight: 700;

      transition: 0.3s ease;
    }

    .open-button:hover {
      background: #2d6195;
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    /* Footer */

    .footer {
      text-align: center;
      color: #a8b8ca;
      font-size: 13px;
      margin-top: 25px;
      line-height: 2.2;
    }

    /* Animations */

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Mobile */

    @media (max-width: 600px) {
      body {
        padding: 15px 10px;
      }

      .header {
        padding: 25px 10px;
      }

      .library {
        padding: 10px;
        border-radius: 15px;
      }

      .library-top {
        align-items: flex-start;
        flex-direction: column;
      }

      .library-title {
        font-size: 16px;
      }

      .iframe-container {
        height: 650px;
      }

      .open-button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- Header -->

    <header class="header">

      <div class="icon">📚</div>

      <h1>مكتبة الصف الثاني عشر</h1>

      <p class="subtitle">
        مكتبتك التعليمية الرقمية
        <br>
        جميع المواد والملفات الدراسية في مكان واحد
      </p>

    </header>

    <!-- Library -->

    <section class="library">

      <div class="library-top">

        <div class="library-title">
          📁 الملفات والمواد الدراسية
        </div>

        <span class="status">
          ● المكتبة التعليمية
        </span>

      </div>

      <!-- Embedded Google Drive Folder -->

      <div class="iframe-container">

        <iframe
          src="https://drive.google.com/embeddedfolderview?id=12UkZJs73JD_5jE31cynohLtWHR9U_Ude#list"
          title="مكتبة مواد الصف الثاني عشر"
          loading="lazy"
          allowfullscreen>
        </iframe>

      </div>

    </section>

    <!-- Footer -->

    <footer class="footer">

      <p>📖 العلم طريق النجاح والتميز</p>

      <a
        class="open-button"
        href="https://drive.google.com/drive/folders/12UkZJs73JD_5jE31cynohLtWHR9U_Ude?usp=drive_link"
        target="_blank"
        rel="noopener noreferrer">

        فتح المكتبة في Google Drive ↗

      </a>

      <p>
        مكتبة مواد الصف الثاني عشر © 2026
      </p>

    </footer>

  </main>

</body>
</html>
